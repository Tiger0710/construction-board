<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工事予定表 - 入力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #f5f7fa; color: #333;
      height: 100vh; display: flex; flex-direction: column;
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }

    /* === Header === */
    .app-header {
      background: linear-gradient(135deg, #1A2E5A 0%, #2c4a8a 100%);
      color: #fff; padding: 0 20px; flex-shrink: 0;
    }
    .header-top {
      min-height: 46px; display: flex; justify-content: space-between; align-items: center;
      gap: 12px;
    }
    .header-primary { display: flex; align-items: center; min-width: 0; }
    .app-header h1 {
      flex-shrink: 0; margin-right: 16px; font-size: 16px; font-weight: 700;
      letter-spacing: 1px; white-space: nowrap;
    }
    .header-links { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
    .header-links a { color: rgba(255,255,255,0.7); font-size: 12px; text-decoration: none; }
    .header-links a:hover { color: #fff; }
    .summary-totals {
      display: flex; gap: 10px; align-items: center;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 10px; border-radius: 7px;
      font-size: 11px; color: rgba(255,255,255,0.85);
      letter-spacing: 0.5px;
    }
    .summary-totals .st-item { display: flex; align-items: center; gap: 4px; }
    .summary-totals .st-label { font-weight: 500; }
    .summary-totals .st-value { font-size: 14px; font-weight: 700; color: #fff; }
    .summary-totals .st-unit { font-size: 11px; color: rgba(255,255,255,0.7); }
    .summary-totals .st-today .st-value { color: #fef3c7; }
    .summary-totals .st-tomorrow .st-value { color: #a7f3d0; }

    /* === Company / User Tabs === */
    .company-tabs,
    .user-tabs {
      display: flex; align-items: center; gap: 2px;
    }
    .company-tab,
    .user-tab {
      background: transparent; border: none; color: rgba(255,255,255,0.6);
      padding: 6px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit; border: 1px solid transparent;
      transition: all 0.2s; white-space: nowrap;
    }
    .company-tab { padding: 10px 13px 9px; font-size: 13px; font-weight: 700; border-radius: 5px; }
    .company-tab:hover,
    .user-tab:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.08); }
    .company-tab.active,
    .user-tab.active {
      color: #fff; border-color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.1);
    }
    .user-tabs {
      margin-left: 8px; padding-left: 9px;
      border-left: 1px solid rgba(255,255,255,0.3);
    }
    .user-tab { padding: 4px 10px; border-radius: 999px; }
    .user-tab.active {
      background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.45);
    }

    /* === Toolbar === */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 40px; gap: 12px; border-top: 1px solid rgba(255,255,255,0.15);
    }
    .toolbar-left, .toolbar-actions { display: flex; align-items: center; gap: 14px; }
    .month-nav { display: flex; align-items: center; gap: 9px; }
    .month-nav button {
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      width: 27px; height: 27px; border-radius: 5px; font-size: 14px;
      cursor: pointer; transition: background 0.2s;
    }
    .month-nav button:hover { background: rgba(255,255,255,0.3); }
    .month-label { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
    .add-proj-btn {
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
      color: #fff; padding: 6px 13px; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .add-proj-btn:hover { background: rgba(255,255,255,0.35); }

    /* === Legend === */
    .legend {
      display: flex; gap: 10px; align-items: center;
      font-size: 11px; color: rgba(255,255,255,0.8);
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .lsw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.3); }
    .lsw.l-day { background: #fbbf24; }
    .lsw.l-night { background: #3b6b9e; }
    .lsw.l-both { background: linear-gradient(to bottom, #fbbf24 50%, #3b6b9e 50%); }
    .lsw.l-off { background: #d1d5db; }
    .lsw.l-pri { background: #fbbf24; position: relative; }
    .lsw.l-pri::after {
      content: ''; position: absolute; top: 1px; right: 1px;
      width: 5px; height: 5px; background: #ef4444; border-radius: 50%;
    }

    /* === Person Selection === */
    .person-select {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1; gap: 24px; padding: 40px 20px;
    }
    .person-select h2 { font-size: 20px; color: #1A2E5A; font-weight: 700; }
    .person-companies {
      display: grid;
      grid-template-columns: repeat(var(--company-count, 3), minmax(220px, 280px));
      gap: 24px; justify-content: center; align-items: start;
    }
    @media (max-width: 900px) {
      .person-companies { grid-template-columns: repeat(auto-fit, minmax(220px, 280px)) !important; }
    }
    .person-company h3 {
      color: #1A2E5A; font-size: 16px; margin: 0 0 10px;
      padding-bottom: 6px; border-bottom: 2px solid #1A2E5A;
    }
    .person-grid {
      display: flex; flex-direction: column; gap: 10px;
    }
    .person-btn {
      background: #fff; border: 2px solid #d0d5dd; border-radius: 10px;
      padding: 0 16px; font-size: 15px; font-weight: 700; color: #1A2E5A;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      width: 100%; min-height: 56px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .person-btn:hover { border-color: #1A2E5A; background: #f0f3fa; box-shadow: 0 4px 16px rgba(26,46,90,0.12); }
    .person-btn .person-count { font-size: 12px; font-weight: 400; color: #888; white-space: nowrap; }
    .person-btn .excel-tag {
      display: inline-block; font-size: 10px; font-weight: 600;
      background: #dcfce7; color: #166534; padding: 2px 8px;
      border-radius: 4px;
    }

    /* === Gantt Area === */
    .main { flex: 1; overflow: hidden; position: relative; }
    .gantt-wrapper { width: 100%; height: 100%; overflow: auto; }
    .gantt {
      border-collapse: separate; border-spacing: 0;
      border-left: 1px solid #d1d5db; border-top: 1px solid #d1d5db;
    }
    .gantt th, .gantt td {
      border-right: 1px solid #d1d5db; border-bottom: 1px solid #d1d5db;
      padding: 0; text-align: center; vertical-align: middle;
      white-space: nowrap;
    }

    /* Sticky columns */
    .s0, .s1, .s2, .s3 { position: sticky; z-index: 2; }
    .s0 { left: 0; width: 30px; min-width: 30px; }
    .s1 { left: 30px; width: 190px; min-width: 190px; max-width: 190px; }
    .s2 { left: 220px; width: 50px; min-width: 50px; }
    .s3 { left: 270px; width: 130px; min-width: 130px; max-width: 130px; }
    thead th { position: sticky; top: 0; z-index: 3; }
    thead th.s0, thead th.s1, thead th.s2, thead th.s3 { z-index: 5; }
    tbody td.s0, tbody td.s1, tbody td.s2, tbody td.s3 { background: #fff; z-index: 2; }
    tbody tr:hover td.s0, tbody tr:hover td.s1, tbody tr:hover td.s2, tbody tr:hover td.s3 { background: #f0f3fa; }

    /* Header cells */
    .gh {
      background: #1A2E5A; color: #fff;
      font-size: 11px; font-weight: 600; padding: 8px 4px;
    }
    .dh {
      background: #f8f9fb; color: #444;
      font-size: 12px; font-weight: 600; padding: 4px 2px;
      width: 36px; min-width: 36px; max-width: 36px;
    }
    .dh .dow { font-size: 10px; font-weight: 400; color: #999; }
    .dh.sun { color: #dc2626; }
    .dh.sun .dow { color: #dc2626; }
    .dh.sat { color: #2563eb; }
    .dh.sat .dow { color: #2563eb; }
    .dh.today-col { background: #dbeafe; }
    .dh.week-border { border-right: 2px solid #9ca3af; }

    /* Body: sticky info cells */
    .sc { text-align: left; padding: 4px 6px; font-size: 12px; line-height: 1.4; }
    .sc .pclient { font-size: 10px; color: #888; }
    .s1.sc {
      overflow: hidden; text-overflow: ellipsis;
      max-width: 190px; font-weight: 500; color: #1A2E5A;
    }
    .s2.sc { font-size: 11px; color: #555; text-align: center; }
    .s3.sc {
      font-size: 11px; color: #555; overflow: hidden;
      text-overflow: ellipsis; border-right: 2px solid #b0b8c8;
    }
    thead th.s3 { border-right: 2px solid #0f1f3e; }
    tbody tr:hover td { background-color: rgba(219,234,254,0.15); }
    .ebtn {
      background: none; border: none; cursor: pointer;
      font-size: 14px; color: #1A2E5A; padding: 2px;
      border-radius: 4px; transition: background 0.2s;
    }
    .ebtn:hover { background: #e0e7f5; }

    /* Gantt cells */
    .gc {
      width: 36px; min-width: 36px; max-width: 36px; height: 42px;
      position: relative; transition: filter 0.1s;
    }
    .gc.sun-bg { background: #fef2f2; }
    .gc.sat-bg { background: #eff6ff; }
    .gc.today-bg { background: #dbeafe; }
    .gc.week-border { border-right: 2px solid #9ca3af; }

    /* In-range cells: continuous bar look */
    .gc.ir { cursor: pointer; }
    .gc.ir:hover { filter: brightness(0.92); }
    .gc.ir.day { background: #fbbf24; }
    .gc.ir.ngt { background: #3b6b9e; }
    .gc.ir.dn { background: linear-gradient(to bottom, #fbbf24 50%, #3b6b9e 50%); }
    .gc.ir.off { background: #d1d5db; }
    /* Remove internal borders for continuous bar */
    .gc.ir.bar-mid { border-right-color: transparent; }
    .gc.ir.bar-mid.week-border { border-right: 2px solid rgba(156,163,175,0.4); }
    /* Rounded corners on first/last cells */
    .gc.ir.bar-start { border-radius: 6px 0 0 6px; }
    .gc.ir.bar-end { border-radius: 0 6px 6px 0; border-right-color: #d1d5db; }
    .gc.ir.bar-start.bar-end { border-radius: 6px; }
    /* Month overflow arrows */
    .bar-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,0.3); z-index: 1;
    }
    .bar-arrow.left { left: 2px; }
    .bar-arrow.right { right: 2px; }
    .pri-dot {
      position: absolute; top: 3px; right: 3px;
      width: 7px; height: 7px; background: #ef4444;
      border-radius: 50%; border: 1px solid #fff;
    }
    /* Adjacent month projects (from today/tomorrow month) */
    tr.adj-row .adj-badge {
      display: inline-block; font-size: 9px; font-weight: 600;
      background: #1A2E5A; color: #fff; padding: 1px 6px;
      border-radius: 3px; margin-left: 4px;
    }

    /* === Save controls === */
    .save-btn {
      background: rgba(255,255,255,0.2); color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 6px 18px; border-radius: 6px; font-size: 13px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .save-btn:not(:disabled):hover { background: #2a4070; }
    .save-status { min-width: 0; font-size: 12px; color: rgba(255,255,255,0.75); white-space: nowrap; }
    .save-status.error { color: #fff; }
    .save-status.success { color: #a7f3d0; }

    /* === Empty & Loading === */
    .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; }
    .empty-state {
      text-align: center; padding: 60px 20px; color: #aaa;
      font-size: 15px; line-height: 1.8;
    }

    /* === Project Modal === */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #fff; border-radius: 14px; width: 100%;
      max-width: 520px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h2 {
      font-size: 18px; font-weight: 700; color: #1A2E5A;
      padding: 20px 24px 0; letter-spacing: 1px;
    }
    .modal-body { padding: 16px 24px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 13px; font-weight: 500;
      color: #555; margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px; border: 1px solid #d0d5dd;
      border-radius: 8px; font-size: 15px; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #1A2E5A; }
    .form-group .fixed-hint {
      display: inline-block; font-size: 10px; font-weight: 600;
      background: #e0e7f5; color: #1A2E5A;
      padding: 1px 6px; border-radius: 3px; margin-left: 6px;
    }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .modal-actions {
      display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 24px 20px;
      border-top: 1px solid #eee;
    }
    .btn-primary {
      flex: 1; background: #1A2E5A; color: #fff; border: none;
      padding: 12px; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-primary:hover { background: #2a4070; }
    .btn-secondary {
      background: #e0e7f5; color: #1A2E5A; border: none;
      padding: 12px 16px; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-secondary:hover { background: #cbd6eb; }
    .modal-message {
      width: 100%; min-height: 18px; color: #287a4b;
      font-size: 13px; text-align: center;
    }
    .btn-danger {
      background: #dc2626; color: #fff; border: none;
      padding: 12px 20px; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-danger:hover { background: #b91c1c; }
    .btn-cancel {
      background: #f0f0f0; color: #666; border: none;
      padding: 12px 20px; border-radius: 8px; font-size: 15px;
      cursor: pointer; font-family: inherit;
    }
    .btn-cancel:hover { background: #e0e0e0; }
    .hidden { display: none !important; }

    /* === Day Editor Modal === */
    .dm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 110; padding: 20px;
    }
    .dm-overlay.hidden { display: none; }
    .dm {
      background: #fff; border-radius: 14px; width: 100%;
      max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .dm-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px 20px 12px; border-bottom: 1px solid #eee;
    }
    .dm-header-info h3 { font-size: 14px; font-weight: 700; color: #1A2E5A; margin-bottom: 2px; }
    .dm-header-info .dm-proj-name { font-size: 12px; color: #888; margin-bottom: 4px; }
    .dm-date-nav { display: flex; align-items: center; gap: 8px; }
    .dm-date-nav button {
      background: #f0f3fa; border: none; width: 28px; height: 28px;
      border-radius: 6px; font-size: 14px; cursor: pointer; color: #1A2E5A;
    }
    .dm-date-nav button:hover { background: #dde3f0; }
    .dm-date-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
    .dm-date-label { font-size: 16px; font-weight: 700; color: #1A2E5A; }
    .dm-date-label.sun { color: #dc2626; }
    .dm-date-label.sat { color: #2563eb; }
    .dm-close {
      background: none; border: none; font-size: 22px;
      color: #999; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .dm-close:hover { color: #333; }
    .dm-body { padding: 16px 20px; }
    .dm-section { margin-bottom: 14px; padding: 12px; background: #f8f9fb; border-radius: 8px; }
    .dm-section.night-section { background: #eff6ff; }
    .dm-section .check-label {
      font-size: 14px; font-weight: 600; color: #333;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none; margin-bottom: 8px;
    }
    .dm-section .check-label input { width: 16px; height: 16px; accent-color: #1A2E5A; }
    .dm-fields { display: flex; flex-direction: column; gap: 8px; }
    .dm-fields input[type="text"], .dm-fields select {
      width: 100%; padding: 8px 10px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 14px; font-family: inherit;
    }
    .dm-fields input:focus, .dm-fields select:focus { outline: none; border-color: #1A2E5A; }
    .dm-fields select { background: #fff; }
    .dm-fields .dm-row { display: flex; gap: 8px; }
    .dm-fields .dm-row > * { flex: 1; }
    .dm-fields .dm-label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .dm-persons { margin-top: 10px; padding: 10px 12px; background: #f8f9fb; border-radius: 8px; }
    .dm-persons summary { font-size: 13px; color: #1A2E5A; cursor: pointer; font-weight: 500; }
    .dm-persons .dm-pgrid {
      display: grid; grid-template-columns: auto 1fr; gap: 6px 8px;
      margin-top: 10px; align-items: center;
    }
    .dm-persons .dm-pgrid label { font-size: 12px; color: #666; white-space: nowrap; }
    .dm-persons .dm-pgrid input {
      padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 13px; font-family: inherit;
    }
    .dm-persons .dm-pgrid input:focus { outline: none; border-color: #1A2E5A; }
    .dm-copy-btn {
      width: 100%; margin-top: 12px; padding: 10px;
      background: #f0f3fa; border: 1px dashed #b0b8c8; border-radius: 8px;
      font-size: 13px; font-weight: 600; color: #1A2E5A;
      cursor: pointer; font-family: inherit; transition: background 0.2s;
    }
    .dm-copy-btn:hover { background: #dde3f0; }
    .dm-copy-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    @media (max-width: 1279px) {
      .header-top { flex-wrap: wrap; padding: 4px 0; }
      .header-primary, .company-tabs, .user-tabs { flex-wrap: wrap; }
      .toolbar { flex-wrap: wrap; padding: 4px 0; }
    }

    @media (max-width: 600px) {
      .legend { display: none; }
      .s1 { width: 140px; min-width: 140px; max-width: 140px; }
      .s2 { left: 170px; }
      .s3 { left: 220px; width: 120px; min-width: 120px; max-width: 120px; }
      .header-links a { display: none; }
      .company-tab { padding: 7px 10px; font-size: 12px; }
      .user-tab { padding: 4px 9px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="header-primary">
        <h1>工事予定表 入力</h1>
        <div class="company-tabs" id="company-tabs" style="display:none"></div>
        <div class="user-tabs" id="user-tabs" style="display:none"></div>
      </div>
      <div class="header-links">
        <div class="summary-totals" id="summary-totals" title="全担当者合計（昼/夜を別件カウント）">
          <div class="st-item st-today">
            <span class="st-label">本日稼働</span>
            <span class="st-value" id="summary-today">-</span>
            <span class="st-unit">件</span>
          </div>
          <div class="st-item st-tomorrow">
            <span class="st-label">明日稼働</span>
            <span class="st-value" id="summary-tomorrow">-</span>
            <span class="st-unit">件</span>
          </div>
        </div>
        <a href="/">サイネージ表示</a>
        <a href="/manual.html">マニュアル</a>
      </div>
    </div>

    <div class="toolbar" id="toolbar" style="display:none">
      <div class="toolbar-left">
        <div class="month-nav">
          <button onclick="changeMonth(-1)">&#9664;</button>
          <span class="month-label" id="month-label"></span>
          <button onclick="changeMonth(1)">&#9654;</button>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="lsw l-day"></span>昼</span>
          <span class="legend-item"><span class="lsw l-night"></span>夜</span>
          <span class="legend-item"><span class="lsw l-both"></span>昼+夜</span>
          <span class="legend-item"><span class="lsw l-off"></span>休み</span>
          <span class="legend-item"><span class="lsw l-pri"></span>重点</span>
        </div>
      </div>
      <div class="toolbar-actions">
        <button class="save-btn" id="save-btn" disabled onclick="saveData()">保存</button>

        <button class="add-proj-btn" id="add-btn" onclick="openModal()" disabled>+ 案件追加</button>
      </div>
    </div>
  </header>

            <label>昼 安品:</label><input type="text" id="dm-day-safety" oninput="onDmField('day_safety_person',this.value)">
            <label>昼 協力担当:</label><input type="text" id="dm-day-partner-person" oninput="onDmField('day_partner_person',this.value)">
            <label>夜 現場:</label><input type="text" id="dm-night-our" oninput="onDmField('night_our_person',this.value)">
            <label>夜 安品:</label><input type="text" id="dm-night-safety" oninput="onDmField('night_safety_person',this.value)">
            <label>夜 協力担当:</label><input type="text" id="dm-night-partner-person" oninput="onDmField('night_partner_person',this.value)">

  <script>
    // ===== 定数 =====
    var API = "/.netlify/functions/data";
    var WEEKDAYS = ["日","月","火","水","木","金","土"];
    var org = { companies: [] };
    var KNOWN_MEMBERS = [];
    var apiMembers = [];

    // 担当者ごとの固定フィールド（新規/編集時に自動入力＆readonly）
    var USER_FIXED_FIELDS = {
      "森_吉村": { client: "KNSI", our_person: "森", safety_person: "髙橋" },
      "谷口":   { client: "NESIC", safety_person: "保科" }
    };
    // フィールド名 → モーダル input ID
    var FIXED_FIELD_INPUT_MAP = {
      client: "m-client",
      our_person: "m-our",
      safety_person: "m-safety"
    };

    // ===== 状態 =====
    var state = {
      user: null,     // 選択中の担当者 (nullなら選択画面)
      month: "",
      data: { projects: [], daily: {} },
      revision: null,
      ready: false,
      saving: false,
      editVersion: 0,
      loadVersion: 0,
      editingId: null,
      dirty: false,
      loading: false
    };
    var dmState = { projId: null, dateStr: null };

    // ===== ユーティリティ =====
    function genId() { return Math.random().toString(36).substr(2, 8); }
    function getNextCalendarDate(ds) {
      var d = new Date(ds + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1);
      return d.toISOString().slice(0, 10);
    }

    function esc(s) {
      if (s == null) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // org.json 取得失敗時のフォールバック（org.json と同内容を保つ）
    var DEFAULT_ORG = {
      companies: [
        { id: "hsj",  name: "HSJ",                   short: "HSJ",   members: ["手島", "森_吉村", "谷口", "河邊"] },
        { id: "kowa", name: "コーワシステム",         short: "コーワ", members: [{ id: "コーワ東京", label: "東京" }, { id: "コーワ大阪", label: "大阪" }] },
        { id: "koyo", name: "光洋エンジニアリング",   short: "光洋",  members: [{ id: "光洋", label: "佐藤" }, "森", "神邊", "猪股", "日向野"] }
      ]
    };

    function memberId(member) {
      return typeof member === "object" && member !== null ? member.id : member;
    }

    function memberLabel(member) {
      if (typeof member === "object" && member !== null) return member.label || member.id;
      var id = memberId(member);
      for (var i = 0; i < org.companies.length; i++) {
        var members = org.companies[i].members || [];
        for (var j = 0; j < members.length; j++) {
          if (memberId(members[j]) === id) {
            return typeof members[j] === "object" && members[j] !== null
              ? (members[j].label || members[j].id)
              : members[j];
          }
        }
      }
      return id;
    }

    async function loadOrg() {
      try {
        var res = await fetch("org.json?_t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        var loaded = await res.json();
        org = loaded && Array.isArray(loaded.companies) && loaded.companies.length > 0 ? loaded : DEFAULT_ORG;
      } catch (e) {
        org = DEFAULT_ORG;
      }
      KNOWN_MEMBERS = [];
      org.companies.forEach(function(company) {
        (company.members || []).forEach(function(member) {
          var id = memberId(member);
          if (KNOWN_MEMBERS.indexOf(id) === -1) KNOWN_MEMBERS.push(id);
        });
      });
    }

    var OTHER_COMPANY = { id: "other", name: "その他", short: "その他", members: [] };

    function companyOfMember(member) {
      if (!member) return OTHER_COMPANY;
      for (var i = 0; i < org.companies.length; i++) {
        if ((org.companies[i].members || []).some(function(item) { return memberId(item) === member; })) return org.companies[i];
      }
      return OTHER_COMPANY;
    }

    function allMembers() {
      var members = KNOWN_MEMBERS.slice();
      apiMembers.forEach(function(member) {
        if (members.indexOf(member) === -1) members.push(member);
      });
      if (state.user && members.indexOf(state.user) === -1) members.push(state.user);
      return members;
    }

    function membersOfCompany(companyId) {
      return allMembers().filter(function(member) {
        var company = companyOfMember(member);
        return company && company.id === companyId;
      });
    }

    function formatMonth(yymm) {
      return (2000 + parseInt(yymm.slice(0,2))) + "年 " + parseInt(yymm.slice(2,4)) + "月";
    }

    function getCurrentMonth() {
      var n = new Date();
      return String(n.getFullYear()%100).padStart(2,"0") + String(n.getMonth()+1).padStart(2,"0");
    }

    function addMonths(yymm, delta) {
      var y = 2000 + parseInt(yymm.slice(0,2));
      var m = parseInt(yymm.slice(2,4)) - 1 + delta;
      var d = new Date(y, m, 1);
      return String(d.getFullYear()%100).padStart(2,"0") + String(d.getMonth()+1).padStart(2,"0");
    }

    function todayStr() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }

    function dateStr(y, m, d) {
      return y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    }

    function fmtDateShort(ds) {
      var p = ds.split("-");
      var d = new Date(+p[0], +p[1]-1, +p[2]);
      return (+p[1]) + "/" + (+p[2]) + " (" + WEEKDAYS[d.getDay()] + ")";
    }

    function getDayData(projId, ds) {
      return state.data.daily[projId + "/" + ds] || null;
    }

    function projectShifts(proj, dd) {
      if (dd) return { day: dd.day !== false, night: dd.night === true };
      var night = proj && proj.default_shift === "night";
      return { day: !night, night: night };
    }

    function ensureDaily(projId, ds) {
      var key = projId + "/" + ds;
      if (!state.data.daily[key]) {
        var shifts = projectShifts(state.data.projects.find(function(p) { return p.id === projId; }), null);
        state.data.daily[key] = {
          day: shifts.day, day_work: "", day_priority: "", day_priority_detail: "",
          day_our_person: "", day_safety_person: "", day_partner_person: "",
          night: shifts.night, night_work: "", night_priority: "", night_priority_detail: "",
          night_our_person: "", night_safety_person: "", night_partner_person: ""
        };
      }
      delete state.data.daily[key]._weekend_auto;
      return state.data.daily[key];
    }

    function applyWeekendPolicy(projId, startDate, endDate, policy) {
      var startParts = startDate.split("-");
      var endParts = endDate.split("-");
      var current = new Date(+startParts[0], +startParts[1]-1, +startParts[2]);
      var end = new Date(+endParts[0], +endParts[1]-1, +endParts[2]);
      var applied = 0;

      while (current <= end) {
        var dow = current.getDay();
        if (dow === 0 || dow === 6) {
          var ds = dateStr(current.getFullYear(), current.getMonth()+1, current.getDate());
          var key = projId + "/" + ds;
          if (policy === "work") {
            if (state.data.daily[key] && state.data.daily[key]._weekend_auto === "off") {
              delete state.data.daily[key];
              applied++;
            }
          } else if (!Object.prototype.hasOwnProperty.call(state.data.daily, key)) {
            state.data.daily[key] = {
              _weekend_auto: "off",
              day: false, day_work: "", day_priority: "", day_priority_detail: "",
              day_our_person: "", day_safety_person: "", day_partner_person: "",
              night: false, night_work: "", night_priority: "", night_priority_detail: "",
              night_our_person: "", night_safety_person: "", night_partner_person: ""
            };
            applied++;
          }
        }
        current.setDate(current.getDate() + 1);
      }
      return applied;
    }

    // ===== ハッシュ管理 =====
    // 形式: #USER/YYMM (例: #手島/2604)
    function parseHash() {
      var h = decodeURIComponent(window.location.hash.replace("#",""));
      var parts = h.split("/");
      if (parts.length === 2 && /^\d{4}$/.test(parts[1])) {
        return { user: parts[0], month: parts[1] };
      }
      if (parts.length === 1 && parts[0]) {
        return { user: parts[0], month: getCurrentMonth() };
      }
      return { user: null, month: getCurrentMonth() };
    }

    function setHash(user, month) {
      if (user) {
        window.location.hash = encodeURIComponent(user) + "/" + month;
      } else {
        window.location.hash = "";
      }
    }

    // ===== API =====
    async function loadData(month) {
      var version = ++state.loadVersion;
      var user = state.user;
      state.loading = true;
      state.ready = false;
      closeModal(); closeDayEditor();
      updateDirtyUI();
      document.getElementById("main").innerHTML = '<div class="loading">読み込み中...</div>';
      try {
        var res = await fetch(API + "?scope=all&month=" + month + "&user=" + encodeURIComponent(user), { cache: "no-store", signal: AbortSignal.timeout(60000) });
        var cur = await res.json();
        if (!res.ok) throw new Error(cur.error || "データ取得失敗");
        if (!Array.isArray(cur.projects) || !cur.daily || !cur._revision) throw new Error("データ形式が不正です。再読み込みしてください");
        if (version !== state.loadVersion || state.user !== user) return;
        state.data = { projects: cur.projects, daily: cur.daily };
        state.revision = cur._revision;
        state.ready = true;
        state.dirty = false;
        showStatus((cur._warnings || []).join(" / "), cur._warnings && cur._warnings.length ? "error" : "");
      } catch (e) {
        if (version !== state.loadVersion || state.user !== user) return;
        showStatus("読み込み失敗: " + e.message, "error");
        document.getElementById("main").innerHTML = '<div class="empty-state">予定を取得できませんでした。入力済みデータは変更されていません。<br><button onclick="loadData(state.month)">再試行</button></div>';
      }
      state.loading = false;
      updateDirtyUI();
      if (state.ready) renderGantt();
    }

    // ===== 全体集計（本日/明日稼働計） =====
    async function loadSummary() {
      try {
        var res = await fetch(API + "?signage=true&_t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        var d = await res.json();
        var items = d.items || [];
        var todayCount = items.filter(function(i) { return i.date === d.today; }).length;
        var tomorrowCount = items.filter(function(i) { return i.date === d.tomorrow; }).length;
        var tEl = document.getElementById("summary-today");
        var mEl = document.getElementById("summary-tomorrow");
        if (tEl) tEl.textContent = todayCount;
        if (mEl) mEl.textContent = tomorrowCount;
      } catch (e) {
        // サマリ取得失敗は黙殺（メイン機能に影響させない）
      }
    }

    async function loadMembers() {
      try {
        var res = await fetch(API + "?month=" + state.month);
        if (!res.ok) return [];
        var d = await res.json();
        return d.members || [];
      } catch (e) {
        return [];
      }
    }

    async function saveData() {
      if (!state.dirty || !state.ready || state.saving) return;
      var user = state.user;
      var version = state.editVersion;
      state.saving = true;
      updateDirtyUI();
      var btn = document.getElementById("save-btn");
      btn.disabled = true; showStatus("保存中...", "");
      try {
        var res = await fetch(API, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ month: state.month, user: user, data: state.data, revision: state.revision, scope: "all" }),
          signal: AbortSignal.timeout(60000)
        });
        var result = await res.json();
        if (res.status === 409) throw new Error(result.error);
        if (!res.ok) throw new Error(result.error || "保存失敗");
        if (!result.revision) throw new Error("保存結果を確認できません。再読み込みしてください");
        state.revision = result.revision;
        state.dirty = state.editVersion !== version;
        showStatus(state.dirty ? "保存しました。続けて編集した内容は未保存です" : "保存しました", "success");
        setTimeout(function() { if (!state.dirty) showStatus("",""); }, 3000);
        loadSummary();
      } catch (e) {
        showStatus("保存エラー: " + e.message, "error");
      }
      state.saving = false;
      updateDirtyUI();
    }

    // ===== UI =====
    function markDirty() { state.dirty = true; state.editVersion++; updateDirtyUI(); }

    function updateDirtyUI() {
      var btn = document.getElementById("save-btn");
      btn.disabled = !state.dirty || !state.ready || state.saving;
      document.getElementById("add-btn").disabled = !state.ready || state.saving;
    }

    function showStatus(msg, type) {
      var el = document.getElementById("save-status");
      el.textContent = msg;
      el.className = "save-status" + (type ? " " + type : "");
    }

    // ===== Company / User Tabs =====
    function updateUserTabs() {
      var currentCompany = companyOfMember(state.user);
      var companies = org.companies.slice();
      var hasOther = allMembers().some(function(member) {
        return companyOfMember(member).id === "other";
      });
      if (hasOther) companies.push(OTHER_COMPANY);

      var companyMembers = membersOfCompany(currentCompany.id);

      var companyHtml = "";
      companies.forEach(function(company) {
        var active = currentCompany.id === company.id ? " active" : "";
        companyHtml += '<button class="company-tab' + active + '" data-company="' + esc(company.id)
          + '" onclick="switchCompany(decodeURIComponent(\'' + encodeURIComponent(company.id) + '\'))">'
          + esc(company.name) + '</button>';
      });
      document.getElementById("company-tabs").innerHTML = companyHtml;

      var userTabs = document.getElementById("user-tabs");
      if (companyMembers.length <= 1) {
        userTabs.innerHTML = "";
        userTabs.style.display = "none";
        return;
      }
      var userHtml = "";
      companyMembers.forEach(function(member) {
        var active = member === state.user ? " active" : "";
        userHtml += '<button class="user-tab' + active + '" data-user="' + esc(member)
          + '" onclick="switchUser(decodeURIComponent(\'' + encodeURIComponent(member) + '\'))">'
          + esc(memberLabel(member)) + '</button>';
      });
      userTabs.innerHTML = userHtml;
      userTabs.style.display = "";
    }

    function switchCompany(companyId) {
      if (companyOfMember(state.user).id === companyId) return;
      var members = membersOfCompany(companyId);
      if (members.length > 0) switchUser(members[0]);
    }

    function switchUser(user) {
      if (state.saving) { showStatus("保存が終わるまでお待ちください", ""); return; }
      if (state.user === user) return;
      if (state.dirty && !confirm("未保存の変更があります。破棄しますか？")) return;
      state.user = user;
      state.dirty = false;
      setHash(user, state.month);
      updateUserTabs();
      loadData(state.month);
    }

    // ===== 画面切り替え =====
    function showGanttMode() {
      document.getElementById("company-tabs").style.display = "";
      document.getElementById("toolbar").style.display = "";
      document.getElementById("month-label").textContent = formatMonth(state.month);
      updateUserTabs();
    }

    function showPersonSelectMode() {
      document.getElementById("company-tabs").style.display = "none";
      document.getElementById("user-tabs").style.display = "none";
      document.getElementById("toolbar").style.display = "none";
    }

    function selectUser(user) {
      if (state.saving) return;
      if (state.dirty && !confirm("未保存の変更があります。破棄しますか？")) return;
      state.user = user;
      state.dirty = false;
      setHash(user, state.month);
      showGanttMode();
      loadData(state.month);
    }

    function goPersonSelect() {
      if (state.saving) return;
      if (state.dirty && !confirm("未保存の変更があります。破棄しますか？")) return;
      state.user = null;
      state.dirty = false;
      setHash(null, state.month);
      showPersonSelectMode();
      renderPersonSelect();
    }

    // ===== 月ナビ =====
    function changeMonth(delta) {
      var newMonth = addMonths(state.month, delta);
      state.month = newMonth;
      setHash(state.user, newMonth);
      document.getElementById("month-label").textContent = formatMonth(newMonth);
      if (state.ready) renderGantt();
      else loadData(newMonth);
    }

    // ===== 担当者選択画面 =====
    async function renderPersonSelect() {
      var main = document.getElementById("main");
      main.innerHTML = '<div class="loading">担当者情報を取得中...</div>';

      apiMembers = await loadMembers();
      // KNOWN_MEMBERS + APIから取得した担当者をマージ（重複排除）
      var members = allMembers();
      var companies = org.companies.slice();
      if (members.some(function(member) { return companyOfMember(member).id === "other"; })) {
        companies.push(OTHER_COMPANY);
      }

      var html = '<div class="person-select">';
      html += '<h2>入力担当者を選んでください</h2>';
      html += '<div class="person-companies" style="--company-count:' + companies.length + '">';
      companies.forEach(function(company) {
        html += '<section class="person-company"><h3>' + esc(company.name) + '</h3><div class="person-grid">';
        membersOfCompany(company.id).forEach(function(name) {
          var hasData = apiMembers.indexOf(name) >= 0;
          html += '<button class="person-btn" onclick="selectUser(decodeURIComponent(\'' + encodeURIComponent(name) + '\'))">';
          html += esc(memberLabel(name));
          html += '<div class="person-count">' + (hasData ? 'データあり' : '新規') + '</div></button>';
        });
        html += '</div></section>';
      });
      html += '</div>';
      html += '</div>';
      main.innerHTML = html;
    }

    // ===== ガントチャート描画 =====
    function renderGantt() {
      if (!state.ready) return;
      var main = document.getElementById("main");

      var yy = parseInt(state.month.slice(0,2));
      var mm = parseInt(state.month.slice(2,4));
      var year = 2000 + yy;
      var dim = new Date(year, mm, 0).getDate();
      var today = todayStr();

      var monthStart = dateStr(year, mm, 1);
      var monthEnd = dateStr(year, mm, dim);
      var projects = state.data.projects.filter(function(p) {
        return p.start_date <= monthEnd && p.end_date >= monthStart;
      });

      var html = '<div class="gantt-wrapper" id="gantt-wrapper"><table class="gantt"><thead><tr>';
      html += '<th class="s0 gh"></th>';
      html += '<th class="s1 gh">工事件名</th>';
      html += '<th class="s2 gh">担当</th>';
      html += '<th class="s3 gh">協力会社</th>';

      // Day header
      for (var d = 1; d <= dim; d++) {
        var ds = dateStr(year, mm, d);
        var dObj = new Date(year, mm-1, d);
        var dow = dObj.getDay();
        var cls = 'dh';
        if (dow === 0) cls += ' sun';
        if (dow === 6) cls += ' sat';
        if (ds === today) cls += ' today-col';
        if (dow === 0 && d < dim) cls += ' week-border';
        html += '<th class="' + cls + '">' + d + '<br><span class="dow">' + WEEKDAYS[dow] + '</span></th>';
      }
      html += '</tr></thead><tbody>';

      // Projects
      for (var i = 0; i < projects.length; i++) {
        var proj = projects[i];
        var overflowLeft = proj.start_date < monthStart;
        var overflowRight = proj.end_date > monthEnd;

        html += '<tr>';
        html += '<td class="s0 sc"><button class="ebtn" onclick="openModal(decodeURIComponent(\'' + encodeURIComponent(proj.id).replace(/'/g, '%27') + '\'))" title="編集">&#9998;</button></td>';
        html += '<td class="s1 sc" title="' + esc(proj.client) + ' / ' + esc(proj.title) + '">'
              + '<span class="pclient">' + esc(proj.client) + '</span><br>' + esc(proj.title) + '</td>';
        html += '<td class="s2 sc">' + esc(proj.our_person || '') + '</td>';
        html += '<td class="s3 sc" title="' + esc(proj.partner || '') + '">' + esc(proj.partner || '') + '</td>';

        for (var d = 1; d <= dim; d++) {
          var ds = dateStr(year, mm, d);
          var dObj = new Date(year, mm-1, d);
          var dow = dObj.getDay();
          var inRange = ds >= proj.start_date && ds <= proj.end_date;
          var isWeekBorder = dow === 0 && d < dim;

          if (!inRange) {
            var ecls = 'gc';
            if (dow === 0) ecls += ' sun-bg';
            else if (dow === 6) ecls += ' sat-bg';
            if (ds === today) ecls += ' today-bg';
            if (isWeekBorder) ecls += ' week-border';
            html += '<td class="' + ecls + '"></td>';
            continue;
          }

          var dd = getDayData(proj.id, ds);
          var shifts = projectShifts(proj, dd);
          var dayOn = shifts.day;
          var nightOn = shifts.night;
          var hasPri = (dayOn && dd && dd.day_priority === "有") || (nightOn && dd && dd.night_priority === "有");

          // Determine cell color class
          var cls = 'gc ir';
          if (dayOn && nightOn) cls += ' dn';
          else if (dayOn) cls += ' day';
          else if (nightOn) cls += ' ngt';
          else cls += ' off';

          // Continuous bar: first/mid/last
          var visStart = proj.start_date < monthStart ? monthStart : proj.start_date;
          var visEnd = proj.end_date > monthEnd ? monthEnd : proj.end_date;
          var isFirst = ds === visStart;
          var isLast = ds === visEnd;
          if (isFirst && isLast) cls += ' bar-start bar-end';
          else if (isFirst) cls += ' bar-start bar-mid';
          else if (isLast) cls += ' bar-end';
          else cls += ' bar-mid';
          if (isWeekBorder) cls += ' week-border';

          var tip = fmtDateShort(ds);
          if (dayOn) tip += ' 昼';
          if (nightOn) tip += ' 夜';
          if (hasPri) tip += ' [重点]';
          if (dd && dd.day_work) tip += '\n' + dd.day_work;
          if (dd && dd.night_work) tip += '\n(夜)' + dd.night_work;

          html += '<td class="' + cls + '" title="' + esc(tip) + '" onclick="openDayEditor(decodeURIComponent(\'' + encodeURIComponent(proj.id).replace(/'/g, '%27') + '\'),\'' + ds + '\')">';
          if (hasPri) html += '<span class="pri-dot"></span>';
          if (isFirst && overflowLeft) html += '<span class="bar-arrow left">◀</span>';
          if (isLast && overflowRight) html += '<span class="bar-arrow right">▶</span>';
          html += '</td>';
        }
        html += '</tr>';
      }

      html += '</tbody></table>';
      if (projects.length === 0) {
        html += '<div class="empty-state">案件がありません。<br>「+ 案件追加」ボタンから追加してください。</div>';
      }
      html += '</div>';
      main.innerHTML = html;
      scrollToToday();
    }

    function scrollToToday() {
      var wrapper = document.getElementById("gantt-wrapper");
      var th = document.querySelector(".today-col");
      if (wrapper && th) {
        wrapper.scrollLeft = Math.max(0, th.offsetLeft - 300);
      }
    }

    // ===== 日次エディタ =====
    function openDayEditor(projId, ds) {
      if (!state.ready) return;
      dmState.projId = projId;
      dmState.dateStr = ds;
      populateDayEditor();
      document.getElementById("dm-overlay").classList.remove("hidden");
    }

    function closeDayEditor() {
      document.getElementById("dm-overlay").classList.add("hidden");
      dmState.projId = null; dmState.dateStr = null;
      renderGantt();
    }

    function populateDayEditor() {
      var proj = state.data.projects.find(function(p) { return p.id === dmState.projId; });
      if (!proj) return;
      var ds = dmState.dateStr;
      var dd = getDayData(dmState.projId, ds);
      var shifts = projectShifts(proj, dd);
      var dayOn = shifts.day;
      var nightOn = shifts.night;

      document.getElementById("dm-proj-name").textContent = proj.client + " / " + proj.title;
      var p = ds.split("-");
      var dObj = new Date(+p[0], +p[1]-1, +p[2]);
      var dow = dObj.getDay();
      var lbl = document.getElementById("dm-date-label");
      lbl.textContent = (+p[1]) + "月" + (+p[2]) + "日 (" + WEEKDAYS[dow] + ")";
      lbl.className = "dm-date-label" + (dow===0?" sun":"") + (dow===6?" sat":"");

      document.getElementById("dm-prev").disabled = !getPrevDate(proj, ds);
      document.getElementById("dm-next").disabled = !getNextDate(proj, ds);

      document.getElementById("dm-day-on").checked = dayOn;
      document.getElementById("dm-day-fields").style.display = dayOn ? "" : "none";
      document.getElementById("dm-day-work").value = dd ? dd.day_work || "" : "";
      document.getElementById("dm-day-pri").value = dd ? dd.day_priority || "" : "";
      document.getElementById("dm-day-detail").value = dd ? dd.day_priority_detail || "" : "";

      document.getElementById("dm-night-on").checked = nightOn;
      document.getElementById("dm-night-fields").style.display = nightOn ? "" : "none";
      document.getElementById("dm-night-work").value = dd ? dd.night_work || "" : "";
      document.getElementById("dm-night-pri").value = dd ? dd.night_priority || "" : "";
      document.getElementById("dm-night-detail").value = dd ? dd.night_priority_detail || "" : "";

      document.getElementById("dm-day-our").value = dd ? dd.day_our_person || "" : "";
      document.getElementById("dm-day-our").placeholder = proj.our_person || "";
      document.getElementById("dm-day-safety").value = dd ? dd.day_safety_person || "" : "";
      document.getElementById("dm-day-safety").placeholder = proj.safety_person || "";
      document.getElementById("dm-day-partner-person").value = dd ? dd.day_partner_person || "" : "";
      document.getElementById("dm-day-partner-person").placeholder = proj.partner_person || "";
      document.getElementById("dm-night-our").value = dd ? dd.night_our_person || "" : "";
      document.getElementById("dm-night-our").placeholder = proj.our_person || "";
      document.getElementById("dm-night-safety").value = dd ? dd.night_safety_person || "" : "";
      document.getElementById("dm-night-safety").placeholder = proj.safety_person || "";
      document.getElementById("dm-night-partner-person").value = dd ? dd.night_partner_person || "" : "";
      document.getElementById("dm-night-partner-person").placeholder = proj.partner_person || "";

      // 前日コピーボタン: 前日にデータがあれば有効
      var prevDs = getPrevDate(proj, ds);
      var prevDd = prevDs ? getDayData(dmState.projId, prevDs) : null;
      document.getElementById("dm-copy-prev").disabled = !prevDd;
    }

    function copyFromPrevDay() {
      var proj = state.data.projects.find(function(p) { return p.id === dmState.projId; });
      if (!proj) return;
      var prevDs = getPrevDate(proj, dmState.dateStr);
      if (!prevDs) return;
      var prevDd = getDayData(dmState.projId, prevDs);
      if (!prevDd) return;

      var dd = ensureDaily(dmState.projId, dmState.dateStr);
      var fields = ["day", "day_work", "day_priority", "day_priority_detail",
                    "day_our_person", "day_safety_person", "day_partner_person",
                    "night", "night_work", "night_priority", "night_priority_detail",
                    "night_our_person", "night_safety_person", "night_partner_person"];
      fields.forEach(function(f) { dd[f] = prevDd[f]; });
      markDirty();
      populateDayEditor();
    }

    function getPrevDate(proj, ds) {
      var p = ds.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]);
      d.setDate(d.getDate() - 1);
      var s = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      return s >= proj.start_date ? s : null;
    }

    function getNextDate(proj, ds) {
      var p = ds.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]);
      d.setDate(d.getDate() + 1);
      var s = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      return s <= proj.end_date ? s : null;
    }

    function dmNav(delta) {
      var proj = state.data.projects.find(function(p) { return p.id === dmState.projId; });
      if (!proj) return;
      var next = (delta < 0 ? getPrevDate : getNextDate)(proj, dmState.dateStr);
      if (next) { dmState.dateStr = next; populateDayEditor(); }
    }

    function onDmToggle(field, checked) {
      var dd = ensureDaily(dmState.projId, dmState.dateStr);
      dd[field] = checked; markDirty();
      if (field === "day") document.getElementById("dm-day-fields").style.display = checked ? "" : "none";
      else document.getElementById("dm-night-fields").style.display = checked ? "" : "none";
    }

    function onDmField(field, value) {
      ensureDaily(dmState.projId, dmState.dateStr)[field] = value;
      markDirty();
    }

    // ===== 案件編集 =====
    function openModal(id) {
      if (!state.ready || state.saving) return;
      state.editingId = id || null;
      var modal = document.getElementById("modal");
      var title = document.getElementById("modal-title");
      var delBtn = document.getElementById("modal-delete");
      document.getElementById("modal-message").textContent = "";

      if (id) {
        var proj = state.data.projects.find(function(p) { return p.id === id; });
        if (!proj) return;
        title.textContent = "案件編集";
        delBtn.classList.remove("hidden");
        document.getElementById("m-client").value = proj.client || "";
        document.getElementById("m-title").value = proj.title || "";
        document.getElementById("m-our").value = proj.our_person || "";
        document.getElementById("m-safety").value = proj.safety_person || "";
        document.getElementById("m-partner").value = proj.partner || "";
        document.getElementById("m-partner-person").value = proj.partner_person || "";
        document.getElementById("m-start").value = proj.start_date || "";
        document.getElementById("m-end").value = proj.end_date || "";
        document.getElementById("m-default-shift").value = proj.default_shift || "day";
        document.getElementById("m-weekend-policy").value = proj.weekend_policy || "off";
      } else {
        title.textContent = "案件追加";
        delBtn.classList.add("hidden");
        var yy = parseInt(state.month.slice(0,2));
        var mm = parseInt(state.month.slice(2,4));
        var y = 2000 + yy;
        document.getElementById("m-client").value = "";
        document.getElementById("m-title").value = "";
        document.getElementById("m-our").value = "";
        document.getElementById("m-safety").value = "";
        document.getElementById("m-partner").value = "";
        document.getElementById("m-partner-person").value = "";
        document.getElementById("m-start").value = y + "-" + String(mm).padStart(2,"0") + "-01";
        document.getElementById("m-end").value = y + "-" + String(mm).padStart(2,"0") + "-" + String(new Date(y,mm,0).getDate()).padStart(2,"0");
        document.getElementById("m-default-shift").value = "day";
        document.getElementById("m-weekend-policy").value = "off";
      }
      applyUserFixedFields(!id);
      modal.classList.remove("hidden");
    }

    // 担当者ごとのデフォルト値をフォームに適用
    //  - 新規/編集どちらでも常にデフォルト値を入れる（既存値は上書き）
    //  - readonlyにはせず、ユーザーはその場で自由に修正可
    //  - 編集時に修正せずそのまま保存すると既存データも自然にデフォルトで上書きされる
    function applyUserFixedFields(isNew) {
      var fixed = USER_FIXED_FIELDS[state.user] || {};
      Object.keys(FIXED_FIELD_INPUT_MAP).forEach(function(field) {
        var el = document.getElementById(FIXED_FIELD_INPUT_MAP[field]);
        if (!el) return;
        var existingHint = el.parentElement.querySelector(".fixed-hint");
        if (existingHint) existingHint.remove();
        el.readOnly = false;
        if (fixed[field] === undefined) return;
        el.value = fixed[field];
        var label = el.parentElement.querySelector("label");
        if (label) {
          var hint = document.createElement("span");
          hint.className = "fixed-hint";
          hint.textContent = "初期値";
          label.appendChild(hint);
        }
      });
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
      state.editingId = null;
    }

    function saveProject() {
      if (!state.ready || state.saving) return;
      var client = document.getElementById("m-client").value.trim();
      var title = document.getElementById("m-title").value.trim();
      var startDate = document.getElementById("m-start").value;
      var endDate = document.getElementById("m-end").value;
      if (!client || !title) { alert("客先と工事件名は必須です"); return; }
      if (!startDate || !endDate) { alert("開始日と終了日は必須です"); return; }
      if (!document.getElementById("m-start").checkValidity() || !document.getElementById("m-end").checkValidity()) { alert("日付は2000年から2099年の範囲で入力してください"); return; }
      if (startDate > endDate) { alert("終了日は開始日以降にしてください"); return; }

      var projData = {
        client: client, title: title,
        our_person: document.getElementById("m-our").value.trim(),
        safety_person: document.getElementById("m-safety").value.trim(),
        partner: document.getElementById("m-partner").value.trim(),
        partner_person: document.getElementById("m-partner-person").value.trim(),
        start_date: startDate, end_date: endDate,
        default_shift: document.getElementById("m-default-shift").value,
        weekend_policy: document.getElementById("m-weekend-policy").value
      };

      if (state.editingId) {
        var idx = state.data.projects.findIndex(function(p) { return p.id === state.editingId; });
        if (idx >= 0) { projData.id = state.editingId; state.data.projects[idx] = projData; }
      } else {
        var related = state.data.projects.find(function(p) {
          return ["client", "title", "our_person", "safety_person", "partner", "partner_person"].every(function(k) {
            return String(p[k] || "").trim() === String(projData[k] || "").trim();
          }) && p.start_date <= getNextCalendarDate(endDate) && getNextCalendarDate(p.end_date) >= startDate;
        });
        if (related && !confirm("同じ内容の案件（" + related.start_date + " ～ " + related.end_date + "）があります。\n継続工事の場合はキャンセルすると既存案件を編集できます。\n別の工事として追加しますか？")) {
          openModal(related.id); return;
        }
        projData.id = genId();
        state.data.projects.push(projData);
      }
      applyWeekendPolicy(projData.id, startDate, endDate, projData.weekend_policy);
      markDirty(); closeModal(); renderGantt();
    }

    function deleteProject() {
      if (!state.ready || state.saving) return;
      if (!state.editingId) return;
      if (!confirm("この案件を削除しますか？\n関連する日次データも削除されます。")) return;
      var id = state.editingId;
      state.data.projects = state.data.projects.filter(function(p) { return p.id !== id; });
      var prefix = id + "/";
      Object.keys(state.data.daily).forEach(function(k) {
        if (k.indexOf(prefix) === 0) delete state.data.daily[k];
      });
      markDirty(); closeModal(); renderGantt();
    }

    // ===== 初期化 =====
    async function init() {
      await loadOrg();
      var parsed = parseHash();
      state.month = parsed.month;

      if (parsed.user) {
        apiMembers = await loadMembers();
        state.user = parsed.user;
        showGanttMode();
        loadData(state.month);
      } else {
        showPersonSelectMode();
        renderPersonSelect();
      }
      loadSummary();
      // 5分ごとにサマリ自動更新
      setInterval(loadSummary, 5 * 60 * 1000);

      window.addEventListener("beforeunload", function(e) {
        if (state.dirty) { e.preventDefault(); e.returnValue = ""; }
      });

      window.addEventListener("hashchange", function() {
        var p = parseHash();
        if (state.saving && p.user !== state.user) { setHash(state.user, state.month); return; }
        if (p.user === state.user && p.month !== state.month && state.ready) {
          state.month = p.month;
          document.getElementById("month-label").textContent = formatMonth(p.month);
          renderGantt(); return;
        }
        if (!p.user) {
          if (state.dirty && !confirm("未保存の変更があります。破棄しますか？")) {
            setHash(state.user, state.month); return;
          }
          state.user = null; state.dirty = false;
          showPersonSelectMode(); renderPersonSelect();
          return;
        }
        if (p.user !== state.user || p.month !== state.month) {
          if (state.dirty && !confirm("未保存の変更があります。破棄しますか？")) {
            setHash(state.user, state.month); return;
          }
          state.user = p.user;
          state.month = p.month;
          state.dirty = false;
          showGanttMode();
          loadMembers().then(function(members) { apiMembers = members; updateUserTabs(); });
          loadData(state.month);
        }
      });
    }

    init();
  </script>
